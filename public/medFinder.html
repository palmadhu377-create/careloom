<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script>
    let myModule = angular.module("mouduleKuch", []);
    let myController = myModule.controller("controllerKuch", function ($scope, $http) {
      $scope.doShowCities = function () {

        let url = "/Show-Cities";
        $http.get(url).then(function (resp) {
          // alert(JSON.stringify(resp.data))
          $scope.jsonAry = resp.data;
        }, function (err) {
          alert(err);
        });
      }


      // inner joining ehe code appan nu medicines dau
      $scope.doShowMedByCity = function () {
        let url = "/show-MedByCity?city=" + $scope.selCity;

        $http.get(url).then(function (resp) {
          //  alert($scope.selCity);
          // alert(JSON.stringify(resp.data))
          $scope.jsonArrayMedicine = resp.data;
        }, function (err) {
          alert(err);
        });


      }

      $scope.doShowSelMed = function () {
        let url = "/Show-selMed?medicine=" + $scope.selMedicines + "&city=" + $scope.selCity;
        $http.get(url).then(function (resp) {
          // alert($scope.selMedicines)
          // alert(JSON.stringify(resp.data))
          $scope.jsonArraySelMed = resp.data;
        }, function (err) {
          alert(err);
        });
      }
      //=====to show donor====
      $scope.doShowDonor = function (Email) {
            let url = "/show-donor?email=" + Email;
            $http.get(url).then(function (resp) {
                $scope.jsonArrayDonor = resp.data;
            }, function (err) {
                alert(err);
            })
        }


    })
  </script>
</head>

<body ng-app="mouduleKuch" ng-controller="controllerKuch" ng-init="doShowCities();">
  <nav class="navbar navbar-expand-lg bg-body-tertiary" >
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="./pics2/CARELOOM.png" alt="Logo" style="width:40px; height:40px;" class="me-2">
    </a>
        <a class="navbar-brand" href="#">CareLoom☘️</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

           
        </div>
    </div>
</nav>



  <form>
    Select cities
    <select ng-model="selCity" ng-change="doShowMedByCity()">
      <option value="none">Select</option>
      <option ng-repeat="obj in jsonAry " value={{obj.city}}>{{obj.city}}</option>

    </select>

    <label>Choose Medicines</label>

    <input list="Med-list" ng-model="selMedicines" placeholder="Type or select...">
    <datalist id="Med-list">
      <option ng-repeat="obj in jsonArrayMedicine" value="{{obj.medname}}"></option>
    </datalist>
    <input type="button" value="Filter Data" ng-click="doShowSelMed();">

  </form>

  <!-- cards -->
  <div class="container">
    <div class="row g-3 mt-4">
      <div class="col-md-3" ng-repeat="obj in jsonArraySelMed">
        <div class="card border border-primary text-center shadow">
          <img src="{{obj.picurl}}" height="100" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title"> {{obj.medname}}</h5>
            <p class="card-text">
              Listed By: {{obj.emailid}}
            </p>

            <p class="card-text">
              Quantity: {{obj.qty}}
            </p>
            <a href="#" ng-click="doShowDonor(obj.emailid)" data-bs-toggle="modal" data-bs-target="#donorModal" class="btn btn-outline-primary">See Donor
              </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DONOR -->
  <div class="modal fade" id="donorModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background-color: azure;">
                <h1 class="modal-title fs-5" id="donortable">Donor's Details</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" >
              <table width="600" class="table table-striped-columns w-75 mt-5"  border="1">
                <thead>
                  <tr >
                    
                    <th scope="col">Sr.No</th>
                    <th scope="col">EmailId</th>
                    <th scope="col">Name</th>
                    <th scope="col">Mobile</th>
                    <th scope="col">Address </th>
                    <th scope="col">City </th>
                    <th scope="col">Aadhar Picture </th>
                    <th scope="col">Profile Picture </th>
                  </tr>
                </thead>
                <tbody>
                  <tr  ng-repeat="obj in jsonArrayDonor" >
                    <th>{{$index+1}}</th> 
                    <td>{{obj.emailid}}</td>
                    <td>{{obj.name}}</td>
                    <td>{{obj.mobile}}</td>
                    <td>{{obj.address}}</td>
                    <td>{{obj.city}}</td>
                    <td>
                        <center>
                            <img src={{obj.acardpath}} width="50" height="50"  alt="">
                        </center>
                         </td>
                         <td>
                        <center>
                            <img src={{obj.picpath}} width="50" height="50"  alt="">
                        </center>
                         </td>
                        
    
                </tr>
                 
                 
            </tbody>
          </table>
                <div class="row">
                    <div class="col-md-3">
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
