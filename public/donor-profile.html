<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <script>
      function doShowPrev(fileCtrl,prev){
          const file=fileCtrl.files[0];
          if(file){
              prev.src=URL.createObjectURL(file);
          }
      }
  </script>
  <script>
    function setEmail(){
      document.getElementById("inputEmail").value=localStorage.getItem("activeuser")
    }
    
  </script>
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


<script>
  $(document).ready(function(){
                $("#btnGetProfile").click(function(){
                    let obj={
                      url:"/fetch-one",
                      data:{
                            emailidKuch:$("#inputEmail").val()
                            
                      }
                    }
                    $.ajax(obj).then(function(jsonAry){
                      alert(JSON.stringify(jsonAry));
                       $("#prevAadhar").prop("src",jsonAry[0].acardpath);
                       $("#prevProfile").prop("src",jsonAry[0].picpath);
                       $("#inputName").val(jsonAry[0].name);
                       $("#inputMobile").val(jsonAry[0].mobile);
                       $("#inputAddress").val(jsonAry[0].address);
                       $("#inputCity").val(jsonAry[0].city);
                       $("#hdnAdhar").val(jsonAry[0].acardpath); 
                       $("#hdnProfile").val(jsonAry[0].picpath); 
                       

                    }).fail(function(err){
                      alert(err);
                    })
                })
          })
</script>

  </head>
  <body  onload="setEmail()">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" >
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="./pics2/CARELOOM.png" alt="Logo" style="width:40px; height:40px;" class="me-2">
      </a>
          <a class="navbar-brand" href="#">CareLoom☘️</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
              aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
  
             
          </div>
      </div>
  </nav>
  
    <!-- <form action="/donorprofile"  method="post"></form> -->

    <div class="container border">
        <div class="row">
            <div class="col-md-12 bg-primary text-white">
           <center> DONOR PROFILE</center> 
            </div>
        </div>
        <form   enctype="multipart/form-data"  method="post">
          <input type="hidden" id="hdnAdhar" name="hdnAdhar">
          <input type="hidden" id="hdnProfile" name="hdnProfile">
            <div class="row mt-2">
                <div class="col-md-8">
                    <label for="inputemail" class="form-label">Email</label>
                    <input type="email" class="form-control" name="inputEmail" id="inputEmail" readonly>
                </div>
                <div class="col-md-3 mt-4">
                  <button type="button"  class="btn btn-outline-primary  w-100"  id="btnGetProfile">Get Profile Data</button>
                </div>
              </div>

                <div class="row mt-2">
                    <div class="col-md-3">
                        <label for="inputname" class="form-label">Name</label>
                        <input type="text" class="form-control" name="inputName" id="inputName" >
                    </div>
                    <div class="col-md-6">
                        <label for="inputMobileno" class="form-label">Mobile</label>
                        <input type="text" class="form-control" name="inputMobile" id="inputMobile" placeholder="+91">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <label for="inputAddress" class="form-label">Address</label>
                        <input type="text" class="form-control" name="inputAddress" id="inputAddress" placeholder="1234 Main St">
                    </div>
                    <div class="col-md-3">
                        <label for="inputCity" class="form-label">City</label>
                        <input type="text" class="form-control" name="inputCity" id="inputCity" >
                    </div>
                </div>
                <div class="row"><!-- div of row strt-->
                    <div class="col-md-6">
                      Upload Aadhaar Card:
                      <br>
                      <input type="file" name="acard" onchange="doShowPrev(this,prevAadhar)">
                      <br>
                      <img src="" id="prevAadhar" class="border rounded shadow mt-2" width="100" height="100">
                    </div>
            
                    <div class="col-md-6">
                      Upload Profile Pic:
                      <br>
                      <input type="file" class name="profilePic" onchange="doShowPrev(this,prevProfile)">
                      <br>
                      <img src="" id="prevProfile" class="border rounded shadow mt-2" width="100" height="100">
                    </div>
                  </div><!-- div of row end-->
                  <div class="row mt-5">
                    <div class="col-md-6">
                       <center> <button type="submit" formaction="/send-data" class="btn btn-outline-primary" id="btnsend">Send to server</button></center>
                    </div>
                    <div class="col-md-6">
                      <center> <button type="submit" formaction="/update-data" class="btn btn-outline-primary" id="btnmodify">Modify my Profile</button></center>
                   </div>
                </div>
            
            </form>
        </div>
                 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
