<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <script>
        let myModule=angular.module("mouduleKuch",[]);
        let myController=myModule.controller("controllerKuch",function($scope,$http){
            $scope.doShowAll=function()
            {
               
                    let url="/fetch-all";
                    $http.get(url).then(function(resp){
                        // alert(JSON.stringify(resp.data))
                           $scope.jsonArray= resp.data;
                    },function(err){
                            alert(err);
                    });
                  }
                  //=========delete=======
                  $scope.doDelete=function(emailidKuch){
                    alert(emailidKuch);
                    let url="/do-delete?emailKeyKuch="+emailidKuch;
                    $http.get(url).then(function(resp){
                        alert(JSON.stringify(resp.data))
                        $scope.doShowAll();
                          
                    },function(err){
                            alert(err);
                    });
                  }
                  $scope.doBlock=function(emailidKuch)
                  {
                    alert(emailidKuch);
                    let url="/do-block?emailKeyKuch="+emailidKuch;
                    $http.get(url).then(function(resp){
                        alert(JSON.stringify(resp.data))
                        $scope.doShowAll();
                          
                    },function(err){
                            alert(err);
                    });
                  }
                  $scope.doResume=function(emailidKuch){
                    alert(emailidKuch);
                    let url="/do-resume?emailKeyKuch="+emailidKuch;
                    $http.get(url).then(function(resp){
                        alert(JSON.stringify(resp.data))
                        $scope.doShowAll();
                          
                    },function(err){
                            alert(err);
                    });
                  }
                 
        })
    </script>

  </head>
  <body ng-app="mouduleKuch" ng-controller="controllerKuch" ng-init="doShowAll();">
    <center>
        <table width="600" class="table table-dark table-striped-columns w-75 mt-5" border="1">
            <thead>
              <tr>
                <th scope="col">Sr.No</th>
                <th scope="col">EmailId</th>
                <th scope="col">Password</th>
                <th scope="col">user type</th>
                <th scope="col">date of submission</th>
                <th scope="col">status </th>
                <th scope="col">Delete User</th>
                <th scope="col">Block User</th>
                <th scope="col">Un-Block User</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="obj in jsonArray" >
                <th>{{$index+1}}</th> 
                <td>{{obj.emailid}}</td>
                <td>{{obj.pwd}}</td>
                <td>{{obj.utype}}</td>
                <td>{{obj.dos}}</td>
                <td>{{obj.active}}</td>
                <td align="center">
                    <a href="#" class="btn btn-outline-danger" ng-click="doDelete(obj.emailid);">Delete</a>
                </td>
                <td align="center">
                  <a href="#" class="btn btn-outline-warning" ng-click="doBlock(obj.emailid);">Block</a>
                </td>
                <td align="center">
                  <a href="#" class="btn btn-outline-success" ng-click="doResume(obj.emailid);">Resume</a>
                </td>
              </tr>
             
             
            </tbody>
          </table>
    </center>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
