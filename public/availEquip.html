<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <script>
         function doShowPrev(fileCtrl,prev){
          const file=fileCtrl.files[0];
          if(file){
              prev.src=URL.createObjectURL(file);
          }
      }
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        function setEmail(){
          document.getElementById("inputEmail").value=localStorage.getItem("activeuser")
        }
        
      </script>
    <script>
        $(document).ready(function () {

            $("#donate").click(function () {
                $("#inputAmount").prop("disabled", true);
                $("#inputAmount").val("");
            });
            $("#sale").click(function () {
                $("#inputAmount").prop("disabled", false);
            });

        });
    </script>
  </head>
  <body onload="setEmail()">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" >
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="./pics2/CARELOOM.png" alt="Logo" style="width:40px; height:40px;" class="me-2">
            </a>
            <a class="navbar-brand" href="#">CareLoom☘️</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
    
               
            </div>
        </div>
    </nav>
    <div class="container border">
        <div class="row">
            <div class="col-md-12 bg-primary text-white">
           <center> Avail Equip</center> 
            </div>
        </div>
        <form   enctype="multipart/form-data"  method="post">
          
            <div class="row g-5">
                <div class="col-md-8">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" name="inputEmail" id="inputEmail">
                </div>
               
              </div>

              <div class="row mt-2">
               
                <div class="col-md-6">
                    
                        <label for="inputEqi" class="form-label">MEDICAL EQUIPMENT</label>
                        <input type="text" class="form-control" id="inputEquip" name="inputEquip">
                      
                    </div>
                    <div class="col-md-3">
                   <select class="form-select" id="condition" name="condition" aria-label="Default select example">
                                      <option selected>Select Conditon </option>
                                      <option value="new">new</option>
                                      <option value="good">good</option>
                                      <option value="poor">poor</option>
                                      
                                      
                                  </select>
                                </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-3">
                        <input class="form-check-input" type="radio" name="radioAmount" id="donate">
                        <label class="form-check-label" for="radioDefault1">
                                DONATION
                        </label>
                    </div>
                    <class class="col-md-3">
                         <input class="form-check-input" type="radio" name="radioAmount" id="sale">
                        <label class="form-check-label" for="radioDefault1">
                            FOR SALE
                    </class>
                    <div class="col-md-3">
                    
                        <label for="inputAmount" class="form-label">Enter Amount</label>
                        <input type="text" class="form-control" id="inputAmount" name="inputAmount" placeholder="₹0" disabled>
                      
                    </div>

                </div>
               
                <div class="row mt-4"><!-- div of row strt-->
                    <div class="col-md-6">
                      Upload Pic:
                      <br>
                      <input type="file" name="Pic" onchange="doShowPrev(this,prevPic)">
                      <br>
                      <img src="" id="prevPic" class="border rounded shadow mt-2" width="100" height="100">
                    </div>
            
                    <div class="col-md-6">
                      Upload  Pic:
                      <br>
                      <input type="file" class name="Pic2" onchange="doShowPrev(this,prevPic2)">
                      <br>
                      <img src="" id="prevPic2" class="border rounded shadow mt-2" width="100" height="100">
                    </div>
               

            </div>
            <div class="row mt-3">
                <div class="col-md-6">
                    <label for="floatingTextarea">Comments</label>
                    <textarea class="form-control" name="inputInfo" placeholder="Leave a comment here" id="inputInfo"></textarea>
                </div>
            </div>
            <div class="row mt-5">
                <div class="col-md-12">
                   <center> <button type="submit" formaction="/equip-data" class="btn btn-outline-primary" id="btnavail" name="btnavail">Avail For Needy's</button></center>
                </div>
                
            </div>
        </form>
            </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
